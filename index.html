<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年级数学口诀 · 交互式学习</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:linear-gradient(160deg,#9ccfa0,#c7edcc);font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
  h1{font-size:40px;font-weight:900;color:#1b4332;text-shadow:3px 3px 0 #fff;letter-spacing:4px;margin-bottom:8px}
  .sub{font-size:15px;color:#2d6a4f;font-weight:bold;margin-bottom:36px}
  .cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .card{width:240px;background:#f6fdf4;border:3px solid #95d5b2;border-radius:18px;box-shadow:0 6px 0 #74c69d;padding:28px 20px;text-align:center;text-decoration:none;transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-6px);box-shadow:0 12px 0 #74c69d}
  .emoji{font-size:52px;margin-bottom:12px}
  .name{font-size:24px;font-weight:900;color:#1b4332;margin-bottom:6px}
  .desc{font-size:13px;color:#2d6a4f;font-weight:bold;line-height:1.5}
  .footer{margin-top:44px;font-size:13px;color:#1b4332;font-weight:bold}
</style>
</head>
<body>
  <h1>🌿 一年级数学口诀</h1>
  <div class="sub">凑十法 · 借十法 · 平十法 —— 交互式学习</div>
  <div class="cards">
    <a class="card" href="凑十法口诀.html">
      <div class="emoji">🐱</div>
      <div class="name">凑十法</div>
      <div class="desc">20以内进位加法<br>看大数，分小数，凑成十，加剩数</div>
    </a>
    <a class="card" href="借十法口诀.html">
      <div class="emoji">🐴</div>
      <div class="name">借十法</div>
      <div class="desc">20以内退位减法<br>拆大数，分出十，减小数，加剩数</div>
    </a>
    <a class="card" href="平十法口诀.html">
      <div class="emoji">🐯</div>
      <div class="name">平十法</div>
      <div class="desc">20以内退位减法<br>拆小数，连续相减算得数</div>
    </a>
  </div>
  <div class="footer">小学数学 · 一年级 · 交互式学习</div>
</body>
</html>
